name: Keep Supabase awake

on:
  schedule:
    # A few database requests each day. Free projects pause when a week has
    # too little user activity, and an every-other-day ping was not enough.
    - cron: "0 8,14,20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "Add GitHub secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/touch_keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json"
